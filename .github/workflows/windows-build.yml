name: Build Windows x64

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Activar soporte para Windows
        run: flutter config --enable-windows-desktop

      - name: Compilar para Windows
        run: flutter build windows --release

      - name: Empaquetar runtime de Visual C++
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"

          function Find-VcCrtDir {
            param([string[]] $SearchRoots)

            foreach ($root in $SearchRoots) {
              if (-not (Test-Path $root)) { continue }

              $match = Get-ChildItem $root -Recurse -Filter "msvcp140.dll" -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.FullName -match "[\\/]x64[\\/]" -and
                  $_.Directory.Name -like "Microsoft.VC*.CRT"
                } |
                Select-Object -First 1

              if ($match) { return $match.Directory }
            }

            return $null
          }

          $searchRoots = @()
          if ($env:VCToolsRedistDir) { $searchRoots += $env:VCToolsRedistDir }

          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -property installationPath
          if ($vsPath) {
            $searchRoots += (Join-Path $vsPath "VC\Redist")
            $searchRoots += (Join-Path $vsPath "VC\Redist\MSVC")
          }

          $crtDir = Find-VcCrtDir -SearchRoots $searchRoots

          if (-not $crtDir) {
            Write-Host "Runtime no encontrado en Visual Studio; descargando redistributable oficial..."
            $redistExe = Join-Path $env:RUNNER_TEMP "vc_redist.x64.exe"
            $extractDir = Join-Path $env:RUNNER_TEMP "vc_redist_extract"
            Invoke-WebRequest -Uri "https://aka.ms/vc14/vc_redist.x64.exe" -OutFile $redistExe
            New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
            & 7z x $redistExe "-o$extractDir" -y | Out-Null
            $crtDir = Find-VcCrtDir -SearchRoots @($extractDir)
          }

          if (-not $crtDir) {
            throw "No se encontraron DLLs del runtime de Visual C++ x64."
          }

          Copy-Item (Join-Path $crtDir.FullName "*.dll") -Destination $releaseDir -Force
          Write-Host "Runtime copiado desde $($crtDir.FullName) a $releaseDir"

      - name: Subir ejecutable (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-windows-x64
          path: build/windows/x64/runner/Release/

      - name: Empaquetar zip de release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Zoc-windows-x64.zip" -Force

      - name: Generar latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $repo = "${{ github.repository }}"
          $base = "https://github.com/$repo/releases/download/$tag"
          @{
            version = $version
            notes = "Release $tag"
            windows = "$base/Zoc-windows-x64.zip"
            macos = "$base/Zoc-macos.zip"
          } | ConvertTo-Json | Out-File -FilePath latest.json -Encoding utf8NoBOM

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Zoc-windows-x64.zip
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
