name: Build macOS

on:
  push:
    # branches: [ "main", "master" ]
    # tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS
        run: flutter build macos --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: build/macos/Build/Products/Release/*.app

      - name: Zip app for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Zoc-macos.zip

      - name: Generate latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          printf '%s\n' \
            '{' \
            "  \"version\": \"${VERSION}\"," \
            "  \"notes\": \"Release ${TAG}\"," \
            "  \"windows\": \"${BASE}/Zoc-windows-x64.zip\"," \
            "  \"macos\": \"${BASE}/Zoc-macos.zip\"" \
            '}' > latest.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Zoc-macos.zip
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
